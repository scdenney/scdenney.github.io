<header class="masthead">
  <div class="masthead__inner">
    {% unless page.url == '/' %}
    <a class="masthead__brand" href="{{ '/' | relative_url }}" aria-label="Steven Denney, home">Steven Denney</a>
    {% endunless %}
    <nav class="masthead__nav" id="site-navigation" aria-label="Primary">
      <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active" aria-current="page"{% endif %}>About</a>
      <a href="{{ '/projects/' | relative_url }}" {% if page.url contains '/projects' %}class="active" aria-current="page"{% endif %}>Projects</a>
      <a href="{{ '/research/' | relative_url }}" {% if page.url contains '/research' %}class="active" aria-current="page"{% endif %}>Research</a>
      <a href="{{ '/teaching/' | relative_url }}" {% if page.url contains '/teaching' %}class="active" aria-current="page"{% endif %}>Teaching</a>
      <a href="{{ '/cv/' | relative_url }}" {% if page.url contains '/cv' %}class="active" aria-current="page"{% endif %}>CV</a>
    </nav>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-navigation">
      <span class="sr-only">Toggle navigation</span>
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</header>
