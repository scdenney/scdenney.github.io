<script>
document.addEventListener('DOMContentLoaded', function () {
  document.documentElement.classList.add('has-js');

  document.querySelectorAll('a[target="_blank"]').forEach(function (link) {
    var rel = (link.getAttribute('rel') || '').split(/\s+/).filter(Boolean);

    if (!rel.includes('noopener')) rel.push('noopener');
    if (!rel.includes('noreferrer')) rel.push('noreferrer');

    link.setAttribute('rel', rel.join(' '));
  });

  var navToggle = document.querySelector('.nav-toggle');
  var navigation = document.getElementById('site-navigation');
  var researchSidebar = document.querySelector('.research-sidebar');
  var researchToc = researchSidebar ? researchSidebar.querySelector('.research-toc') : null;
  var researchToggle = null;
  var researchClose = null;
  var researchBackgroundElements = [];
  var mainContent = document.getElementById('main-content');
  var siteFooter = document.querySelector('.site-footer');
  var masthead = document.querySelector('.masthead');
  var cvPreview = document.querySelector('.cv-preview');

  function setElementsInert(elements, inert) {
    elements.filter(Boolean).forEach(function (element) {
      element.toggleAttribute('inert', inert);
    });
  }

  function getFocusableElements(containers) {
    var selector = 'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
    var focusable = [];

    containers.filter(Boolean).forEach(function (container) {
      if (container.matches && container.matches(selector)) focusable.push(container);
      container.querySelectorAll(selector).forEach(function (element) {
        focusable.push(element);
      });
    });

    return focusable.filter(function (element, index) {
      return focusable.indexOf(element) === index && !element.closest('[inert]') && element.getClientRects().length > 0;
    });
  }

  function trapFocus(event, containers) {
    if (event.key !== 'Tab') return;

    var focusable = getFocusableElements(containers);
    if (!focusable.length) return;

    var first = focusable[0];
    var last = focusable[focusable.length - 1];

    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus();
    } else if (!containers.some(function (container) { return container && container.contains(document.activeElement); })) {
      event.preventDefault();
      first.focus();
    }
  }

  if (cvPreview && window.matchMedia('(min-width: 861px)').matches) {
    cvPreview.open = true;
  }

  function closeNavigation(restoreFocus) {
    if (!navToggle || !navigation) return;

    var wasOpen = document.body.classList.contains('nav-open');
    navToggle.setAttribute('aria-expanded', 'false');
    navigation.classList.remove('active');
    document.body.classList.remove('nav-open');
    if (wasOpen) setElementsInert([mainContent, siteFooter], false);
    navigation.toggleAttribute('inert', window.matchMedia('(max-width: 860px)').matches);

    if (restoreFocus && wasOpen) navToggle.focus();
  }

  if (navToggle && navigation) {
    closeNavigation(false);
    document.documentElement.classList.add('nav-ready');

    navToggle.addEventListener('click', function () {
      var isExpanded = navToggle.getAttribute('aria-expanded') === 'true';

      if (isExpanded) {
        closeNavigation(true);
        return;
      }

      navToggle.setAttribute('aria-expanded', 'true');
      navigation.removeAttribute('inert');
      navigation.classList.add('active');
      document.body.classList.add('nav-open');
      setElementsInert([mainContent, siteFooter], true);

      var firstLink = navigation.querySelector('a');
      if (firstLink) firstLink.focus();
    });

    navigation.querySelectorAll('a').forEach(function (link) {
      link.addEventListener('click', function () {
        closeNavigation(false);
      });
    });

    document.addEventListener('click', function (event) {
      if (!document.body.classList.contains('nav-open')) return;
      if (event.target.closest('.masthead__nav') || event.target.closest('.nav-toggle')) return;
      closeNavigation(true);
    });

    document.addEventListener('keydown', function (event) {
      if (!document.body.classList.contains('nav-open')) return;

      if (event.key === 'Escape') {
        event.preventDefault();
        closeNavigation(true);
        return;
      }

      trapFocus(event, [navigation, navToggle]);
    });

    window.addEventListener('resize', function () {
      if (window.innerWidth > 860 || !document.body.classList.contains('nav-open')) {
        closeNavigation(false);
      }
    });
  }

  function closeResearchToc(restoreFocus) {
    if (!researchSidebar || !researchToggle) return;

    var wasOpen = researchSidebar.classList.contains('is-open');
    researchSidebar.classList.remove('is-open');
    researchToggle.setAttribute('aria-expanded', 'false');
    document.body.classList.remove('research-toc-open');
    setElementsInert(researchBackgroundElements, false);

    if (restoreFocus && wasOpen) researchToggle.focus();
  }

  if (researchSidebar && researchToc) {
    var researchLayout = researchSidebar.closest('.research-layout');
    var researchSidebarInner = researchSidebar.querySelector('.research-sidebar-inner');
    researchSidebar.id = researchSidebar.id || 'research-section-navigation';

    researchToggle = document.createElement('button');
    researchToggle.type = 'button';
    researchToggle.className = 'research-toc-toggle';
    researchToggle.setAttribute('aria-expanded', 'false');
    researchToggle.setAttribute('aria-controls', researchSidebar.id);
    researchToggle.textContent = 'Browse sections';

    if (researchLayout) {
      researchLayout.insertAdjacentElement('beforebegin', researchToggle);
    }

    if (researchSidebarInner) {
      researchClose = document.createElement('button');
      researchClose.type = 'button';
      researchClose.className = 'research-sidebar-close';
      researchClose.setAttribute('aria-label', 'Close sections');
      researchClose.textContent = '×';
      researchSidebarInner.insertAdjacentElement('afterbegin', researchClose);

      researchClose.addEventListener('click', function () {
        closeResearchToc(true);
      });
    }

    researchBackgroundElements = [masthead, siteFooter, researchToggle, document.querySelector('.research-content')];

    researchToggle.addEventListener('click', function () {
      var willOpen = !researchSidebar.classList.contains('is-open');

      if (!willOpen) {
        closeResearchToc(true);
        return;
      }

      researchSidebar.classList.add('is-open');
      researchToggle.setAttribute('aria-expanded', 'true');
      document.body.classList.add('research-toc-open');
      if (researchClose) researchClose.focus();
      setElementsInert(researchBackgroundElements, true);
    });

    researchSidebar.addEventListener('click', function (event) {
      if (event.target !== researchSidebar) return;
      closeResearchToc(true);
    });

    researchToc.querySelectorAll('a').forEach(function (link) {
      link.addEventListener('click', function () {
        closeResearchToc(false);
      });
    });

    window.addEventListener('resize', function () {
      if (window.innerWidth > 860) {
        closeResearchToc(false);
      }
    });

    document.addEventListener('keydown', function (event) {
      if (!researchSidebar.classList.contains('is-open')) return;

      if (event.key === 'Escape') {
        event.preventDefault();
        closeResearchToc(true);
        return;
      }

      trapFocus(event, [researchSidebar]);
    });
  }

  if (researchToc) {
    var tocLinks = Array.prototype.slice.call(researchToc.querySelectorAll('a[href^="#"]'));
    var headings = [];
    tocLinks.forEach(function (link) {
      var id = link.getAttribute('href').slice(1);
      var heading = document.getElementById(id);
      if (heading) headings.push({ id: id, el: heading, link: link });
    });

    if (headings.length) {
      var activeId = null;
      var wideResearchToc = window.matchMedia('(min-width: 1025px)');
      function setActive(id) {
        if (id === activeId) return;
        activeId = id;
        headings.forEach(function (h) {
          h.link.classList.toggle('is-active', h.id === id);
        });
      }

      function updateActiveSection() {
        if (!wideResearchToc.matches) {
          setActive(null);
          return;
        }

        var threshold = 120;
        var scrollBottom = window.innerHeight + window.scrollY;
        var pageHeight = document.documentElement.scrollHeight;
        if (scrollBottom >= pageHeight - 4) {
          setActive(headings[headings.length - 1].id);
          return;
        }
        var current = headings[0];
        for (var i = 0; i < headings.length; i++) {
          if (headings[i].el.getBoundingClientRect().top <= threshold) {
            current = headings[i];
          } else {
            break;
          }
        }
        setActive(current.id);
      }

      var rafPending = false;
      function scheduleUpdate() {
        if (rafPending) return;
        rafPending = true;
        window.requestAnimationFrame(function () {
          rafPending = false;
          updateActiveSection();
        });
      }

      window.addEventListener('scroll', scheduleUpdate, { passive: true });
      window.addEventListener('resize', scheduleUpdate);
      updateActiveSection();
    }
  }

  var projectGrid = document.querySelector('.project-grid');

  if (projectGrid) {
    var projectTiles = Array.prototype.slice.call(projectGrid.querySelectorAll('.project-tile'));
    var topicLabels = {};
    var topicOrder = [];
    var projectFilter = { status: 'all', topic: null };
    var emptyMessage = document.createElement('p');

    var resultStatus = document.createElement('p');
    var activeProject = null;

    function applyProjectFilter() {
      var shown = 0;

      projectTiles.forEach(function (tile) {
        var matches = (projectFilter.status === 'all' || tile.dataset.status === projectFilter.status) &&
          (!projectFilter.topic || tile.dataset.topics.split(' ').indexOf(projectFilter.topic) > -1);

        tile.hidden = !matches;
        if (matches) shown += 1;
      });

      emptyMessage.hidden = shown > 0;
      resultStatus.textContent = shown + (shown === 1 ? ' project' : ' projects') + ' shown';
    }

    function openProject(tile, opener) {
      if (activeProject && activeProject.tile === tile) return;
      if (activeProject) activeProject.close(false);

      var scrim = document.createElement('div');
      var drawer = document.createElement('div');
      var closeButton = document.createElement('button');
      var heading = document.createElement('h2');
      var top = tile.querySelector('.project-tile__top').cloneNode(true);
      var detail = tile.querySelector('.project-detail').cloneNode(true);
      var cue = top.querySelector('.project-tile__cue');

      if (cue) cue.remove();

      scrim.className = 'project-drawer-scrim';
      drawer.className = 'project-drawer';
      drawer.setAttribute('role', 'dialog');
      drawer.setAttribute('aria-modal', 'true');
      drawer.setAttribute('aria-labelledby', 'project-drawer-title');
      drawer.style.setProperty('--topic-color', window.getComputedStyle(tile).getPropertyValue('--topic-color'));

      closeButton.type = 'button';
      closeButton.className = 'project-drawer__close';
      closeButton.textContent = 'Close';

      heading.id = 'project-drawer-title';
      heading.textContent = tile.querySelector('.project-tile__title').textContent.replace(/\s+/g, ' ').trim();

      detail.querySelectorAll('.project-outputs').forEach(function (group) {
        var count = document.createElement('span');

        count.textContent = group.querySelectorAll('li').length;
        group.querySelector('h3').appendChild(count);
      });

      drawer.appendChild(closeButton);
      drawer.appendChild(top);
      drawer.appendChild(heading);
      drawer.appendChild(tile.querySelector('.project-tile__summary').cloneNode(true));
      drawer.appendChild(detail);
      document.body.appendChild(scrim);
      document.body.appendChild(drawer);
      document.body.classList.add('project-drawer-open');
      setElementsInert([masthead, mainContent, siteFooter], true);

      window.requestAnimationFrame(function () {
        if (!activeProject || activeProject.drawer !== drawer) return;
        scrim.classList.add('is-open');
        drawer.classList.add('is-open');
      });
      closeButton.focus();

      function closeProject(restoreFocus) {
        if (!activeProject || activeProject.drawer !== drawer) return;
        activeProject = null;
        document.removeEventListener('keydown', onKeydown);
        document.body.classList.remove('project-drawer-open');
        setElementsInert([masthead, mainContent, siteFooter], false);
        scrim.classList.remove('is-open');
        scrim.style.pointerEvents = 'none';
        drawer.classList.remove('is-open');
        drawer.setAttribute('inert', '');
        heading.removeAttribute('id');
        window.setTimeout(function () {
          scrim.remove();
          drawer.remove();
        }, 260);
        if (restoreFocus !== false && opener && !opener.closest('[hidden]')) opener.focus();
      }

      activeProject = { tile: tile, drawer: drawer, close: closeProject };

      function dismissProject() {
        if (projectFromHash() === tile) {
          window.history.replaceState(window.history.state, '', window.location.pathname + window.location.search);
        }
        closeProject(true);
      }

      function onKeydown(event) {
        if (event.key === 'Escape') {
          event.preventDefault();
          dismissProject();
          return;
        }

        trapFocus(event, [drawer]);
      }

      closeButton.addEventListener('click', dismissProject);
      scrim.addEventListener('click', dismissProject);
      document.addEventListener('keydown', onKeydown);
    }

    projectTiles.forEach(function (tile) {
      var title = tile.querySelector('.project-tile__title');
      var openLink = document.createElement('a');
      var cue = document.createElement('span');

      tile.querySelectorAll('[data-topic]').forEach(function (topic) {
        if (topicLabels[topic.dataset.topic]) return;
        topicLabels[topic.dataset.topic] = topic.textContent.trim();
        topicOrder.push(topic.dataset.topic);
      });

      openLink.href = '#' + tile.id;
      openLink.className = 'project-tile__open';
      openLink.setAttribute('aria-haspopup', 'dialog');
      while (title.firstChild) openLink.appendChild(title.firstChild);
      title.appendChild(openLink);
      openLink.addEventListener('click', function (event) {
        if (event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
        event.preventDefault();
        if (projectFromHash() !== tile) {
          window.history.pushState(window.history.state, '', '#' + tile.id);
        }
        openProject(tile, openLink);
      });

      cue.className = 'project-tile__cue';
      cue.setAttribute('aria-hidden', 'true');
      cue.textContent = 'View project';
      tile.querySelector('.project-tile__top').appendChild(cue);

      var featured = tile.querySelector('.project-outputs[data-type="article"] a[href], .project-outputs[data-type="monograph"] a[href]');
      var featuredLabel = 'Published research';

      if (!featured) {
        featured = Array.prototype.slice.call(tile.querySelectorAll('.project-outputs[data-type="review"] a[href], .project-outputs[data-type="progress"] a[href]')).filter(function (link) {
          return /working paper|ssrn/i.test(link.textContent);
        })[0];
        featuredLabel = 'Working paper';
      }
      if (!featured) {
        featured = tile.querySelector('.project-detail__links a[href]');
        featuredLabel = 'Project repository';
      }
      if (featured) {
        var resource = document.createElement('p');
        var label = document.createElement('span');
        var resourceLink = featured.cloneNode(true);

        resource.className = 'project-featured';
        label.className = 'project-featured__label';
        label.textContent = featuredLabel;
        resourceLink.className = 'project-featured__link';
        resourceLink.removeAttribute('style');
        resourceLink.textContent = featuredLabel === 'Published research' ? 'Read publication' : featuredLabel === 'Working paper' ? 'Read working paper' : 'View repository';
        resource.appendChild(label);
        resource.appendChild(resourceLink);
        tile.appendChild(resource);
      }
    });

    function projectFromHash() {
      var id;
      try { id = decodeURIComponent(window.location.hash.slice(1)); } catch (error) { return null; }
      return projectTiles.filter(function (tile) { return tile.id === id; })[0] || null;
    }

    function syncProjectWithHash() {
      var tile = projectFromHash();
      if (tile) {
        openProject(tile, tile.querySelector('.project-tile__open'));
      } else if (activeProject) {
        activeProject.close(true);
      }
    }

    window.addEventListener('popstate', syncProjectWithHash);
    window.addEventListener('hashchange', syncProjectWithHash);
    syncProjectWithHash();

    var filterBar = document.createElement('div');
    var statusGroup = document.createElement('div');
    var topicGroup = document.createElement('div');
    var statusCounts = { all: projectTiles.length, active: 0, completed: 0 };

    projectTiles.forEach(function (tile) {
      statusCounts[tile.dataset.status] += 1;
    });

    filterBar.className = 'project-filters';
    statusGroup.className = 'project-filters__status';
    statusGroup.setAttribute('role', 'group');
    statusGroup.setAttribute('aria-label', 'Filter projects by status');
    topicGroup.className = 'project-filters__topics';
    topicGroup.setAttribute('role', 'group');
    topicGroup.setAttribute('aria-label', 'Filter projects by topic');

    [['all', 'All'], ['active', 'Active'], ['completed', 'Completed']].forEach(function (status) {
      var button = document.createElement('button');

      button.type = 'button';
      button.textContent = status[1] + ' ' + statusCounts[status[0]];
      button.setAttribute('aria-pressed', String(status[0] === projectFilter.status));
      button.addEventListener('click', function () {
        projectFilter.status = status[0];
        statusGroup.querySelectorAll('button').forEach(function (other) {
          other.setAttribute('aria-pressed', String(other === button));
        });
        applyProjectFilter();
      });
      statusGroup.appendChild(button);
    });

    topicOrder.forEach(function (topic) {
      var button = document.createElement('button');

      button.type = 'button';
      button.dataset.topic = topic;
      button.textContent = topicLabels[topic];
      button.setAttribute('aria-pressed', 'false');
      button.addEventListener('click', function () {
        projectFilter.topic = projectFilter.topic === topic ? null : topic;
        topicGroup.querySelectorAll('button').forEach(function (other) {
          other.setAttribute('aria-pressed', String(other.dataset.topic === projectFilter.topic));
        });
        applyProjectFilter();
      });
      topicGroup.appendChild(button);
    });

    resultStatus.className = 'project-filters__results';
    resultStatus.setAttribute('role', 'status');
    resultStatus.setAttribute('aria-live', 'polite');
    resultStatus.setAttribute('aria-atomic', 'true');
    filterBar.appendChild(statusGroup);
    filterBar.appendChild(topicGroup);
    filterBar.appendChild(resultStatus);
    projectGrid.parentNode.insertBefore(filterBar, projectGrid);

    emptyMessage.className = 'project-grid__empty';
    emptyMessage.textContent = 'No projects match these filters. Choose another status or topic.';
    emptyMessage.hidden = true;
    projectGrid.appendChild(emptyMessage);
    applyProjectFilter();
  }
});
</script>
