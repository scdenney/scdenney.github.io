<script>
document.addEventListener('DOMContentLoaded', function () {
  document.documentElement.classList.add('has-js');

  document.querySelectorAll('a[target="_blank"]').forEach(function (link) {
    var rel = (link.getAttribute('rel') || '').split(/\s+/).filter(Boolean);

    if (!rel.includes('noopener')) rel.push('noopener');
    if (!rel.includes('noreferrer')) rel.push('noreferrer');

    link.setAttribute('rel', rel.join(' '));
  });

  var navToggle = document.querySelector('.nav-toggle');
  var navigation = document.getElementById('site-navigation');
  var researchSidebar = document.querySelector('.research-sidebar');
  var researchToc = researchSidebar ? researchSidebar.querySelector('.research-toc') : null;
  var researchToggle = null;

  function closeNavigation() {
    if (!navToggle || !navigation) return;

    navToggle.setAttribute('aria-expanded', 'false');
    navigation.classList.remove('active');
    document.body.classList.remove('nav-open');
  }

  if (navToggle && navigation) {
    navToggle.addEventListener('click', function () {
      var isExpanded = navToggle.getAttribute('aria-expanded') === 'true';

      navToggle.setAttribute('aria-expanded', String(!isExpanded));
      navigation.classList.toggle('active');
      document.body.classList.toggle('nav-open', !isExpanded);
    });

    navigation.querySelectorAll('a').forEach(function (link) {
      link.addEventListener('click', closeNavigation);
    });

    document.addEventListener('click', function (event) {
      if (!document.body.classList.contains('nav-open')) return;
      if (event.target.closest('.masthead__nav') || event.target.closest('.nav-toggle')) return;
      closeNavigation();
    });

    document.addEventListener('keyup', function (event) {
      if (event.key === 'Escape') {
        closeNavigation();
      }
    });

    window.addEventListener('resize', function () {
      if (window.innerWidth > 860) {
        closeNavigation();
      }
    });
  }

  function closeResearchToc() {
    if (!researchSidebar || !researchToggle) return;

    researchSidebar.classList.remove('is-open');
    researchToggle.setAttribute('aria-expanded', 'false');
    document.body.classList.remove('research-toc-open');
  }

  if (researchSidebar && researchToc) {
    var researchLayout = researchSidebar.closest('.research-layout');
    var researchSidebarInner = researchSidebar.querySelector('.research-sidebar-inner');
    var researchClose = null;

    researchToggle = document.createElement('button');
    researchToggle.type = 'button';
    researchToggle.className = 'research-toc-toggle';
    researchToggle.setAttribute('aria-expanded', 'false');
    researchToggle.textContent = 'Browse sections';

    if (researchLayout) {
      researchLayout.insertAdjacentElement('beforebegin', researchToggle);
    }

    if (researchSidebarInner) {
      researchClose = document.createElement('button');
      researchClose.type = 'button';
      researchClose.className = 'research-sidebar-close';
      researchClose.setAttribute('aria-label', 'Close sections');
      researchClose.textContent = '×';
      researchSidebarInner.insertAdjacentElement('afterbegin', researchClose);

      researchClose.addEventListener('click', closeResearchToc);
    }

    researchToggle.addEventListener('click', function () {
      var willOpen = !researchSidebar.classList.contains('is-open');
      researchSidebar.classList.toggle('is-open', willOpen);
      researchToggle.setAttribute('aria-expanded', String(willOpen));
      document.body.classList.toggle('research-toc-open', willOpen);
    });

    researchSidebar.addEventListener('click', function (event) {
      if (event.target !== researchSidebar) return;
      closeResearchToc();
    });

    researchToc.querySelectorAll('a').forEach(function (link) {
      link.addEventListener('click', closeResearchToc);
    });

    window.addEventListener('resize', function () {
      if (window.innerWidth > 860) {
        closeResearchToc();
      }
    });

    document.addEventListener('keyup', function (event) {
      if (event.key === 'Escape') {
        closeResearchToc();
      }
    });
  }

  if (researchToc) {
    var tocLinks = Array.prototype.slice.call(researchToc.querySelectorAll('a[href^="#"]'));
    var headings = [];
    tocLinks.forEach(function (link) {
      var id = link.getAttribute('href').slice(1);
      var heading = document.getElementById(id);
      if (heading) headings.push({ id: id, el: heading, link: link });
    });

    if (headings.length) {
      var activeId = null;
      function setActive(id) {
        if (id === activeId) return;
        activeId = id;
        headings.forEach(function (h) {
          h.link.classList.toggle('is-active', h.id === id);
        });
      }

      function updateActiveSection() {
        var threshold = 120;
        var scrollBottom = window.innerHeight + window.scrollY;
        var pageHeight = document.documentElement.scrollHeight;
        if (scrollBottom >= pageHeight - 4) {
          setActive(headings[headings.length - 1].id);
          return;
        }
        var current = headings[0];
        for (var i = 0; i < headings.length; i++) {
          if (headings[i].el.getBoundingClientRect().top <= threshold) {
            current = headings[i];
          } else {
            break;
          }
        }
        setActive(current.id);
      }

      var rafPending = false;
      function scheduleUpdate() {
        if (rafPending) return;
        rafPending = true;
        window.requestAnimationFrame(function () {
          rafPending = false;
          updateActiveSection();
        });
      }

      window.addEventListener('scroll', scheduleUpdate, { passive: true });
      window.addEventListener('resize', scheduleUpdate);
      updateActiveSection();
    }
  }

  document.querySelectorAll('.research-section').forEach(function (section) {
    var items = section.querySelectorAll('.publication-item');

    if (items.length <= 5) return;

    section.classList.add('is-collapsible', 'is-collapsed');

    var button = document.createElement('button');
    button.type = 'button';
    button.className = 'show-more-btn';
    button.setAttribute('aria-expanded', 'false');
    button.textContent = 'Show all ' + items.length + ' items';
    section.appendChild(button);

    button.addEventListener('click', function () {
      var isCollapsed = section.classList.toggle('is-collapsed');

      button.setAttribute('aria-expanded', String(!isCollapsed));
      button.textContent = isCollapsed ? 'Show all ' + items.length + ' items' : 'Show fewer';
    });
  });

  var detailSwitcherIndex = 0;

  document.querySelectorAll('.project-card').forEach(function (card) {
    var details = Array.prototype.slice.call(card.querySelectorAll(':scope > details'));

    if (!details.length) return;

    detailSwitcherIndex += 1;

    var switcher = document.createElement('div');
    var actions = document.createElement('div');
    var panel = document.createElement('div');
    var panelId = 'detail-panel-' + detailSwitcherIndex;
    var entries = details.map(function (detail, index) {
      var summary = detail.querySelector('summary');
      var content = detail.querySelector(':scope > div');

      return {
        label: summary.textContent.trim(),
        content: content,
        buttonId: panelId + '-button-' + (index + 1)
      };
    });

    switcher.className = 'detail-switcher';
    actions.className = 'detail-actions';
    panel.className = 'detail-panel';
    panel.id = panelId;
    panel.setAttribute('role', 'region');
    panel.hidden = true;

    entries.forEach(function (entry) {
      var button = document.createElement('button');

      button.type = 'button';
      button.id = entry.buttonId;
      button.textContent = entry.label;
      button.setAttribute('aria-controls', panelId);
      button.setAttribute('aria-expanded', 'false');

      button.addEventListener('click', function () {
        var wasOpen = button.getAttribute('aria-expanded') === 'true';

        actions.querySelectorAll('button').forEach(function (otherButton) {
          otherButton.setAttribute('aria-expanded', 'false');
        });

        if (wasOpen) {
          panel.hidden = true;
          panel.removeAttribute('aria-labelledby');
          panel.replaceChildren();
          return;
        }

        button.setAttribute('aria-expanded', 'true');
        panel.setAttribute('aria-labelledby', entry.buttonId);
        panel.replaceChildren(entry.content);
        panel.hidden = false;
      });

      actions.appendChild(button);
    });

    details.forEach(function (detail) {
      detail.remove();
    });

    switcher.appendChild(actions);
    switcher.appendChild(panel);
    card.appendChild(switcher);
  });

  document.querySelectorAll('.recently-completed').forEach(function (group) {
    var cards = group.querySelectorAll('.project-card');

    if (!cards.length) return;

    var collapsedLabel = 'Show ' + cards.length + ' recently completed project' + (cards.length === 1 ? '' : 's');

    function setCollapsed(collapsed) {
      group.classList.toggle('is-collapsible', true);
      group.classList.toggle('is-collapsed', collapsed);
      group.style.display = collapsed ? 'none' : '';
      button.setAttribute('aria-expanded', String(!collapsed));
      button.textContent = collapsed ? collapsedLabel : 'Hide recently completed projects';
    }

    var button = document.createElement('button');
    button.type = 'button';
    button.className = 'show-more-btn';
    group.insertAdjacentElement('beforebegin', button);

    setCollapsed(true);

    button.addEventListener('click', function () {
      setCollapsed(group.style.display !== 'none');
    });
  });
});
</script>
